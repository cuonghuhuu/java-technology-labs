# Trường Đại học Công nghệ Đông Á (EAUT)
# Học phần: Công nghệ Java (IT3242)
# ==========================================

# Cổng khởi chạy máy chủ ứng dụng
server.port=8080
server.servlet.context-path=

# Tên ứng dụng
spring.application.name=lab11-springboot-thymeleaf

# Cấu hình Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Cấu hình Static Resources
spring.web.resources.static-locations=classpath:/static/

# Định dạng logging console
logging.level.vn.edu.eaut.lab11=DEBUG
logging.level.org.springframework.web=INFO
