# ===================================================================
# Lab 13 - Spring Data JPA Application Properties (H2 In-Memory)
# ===================================================================

spring.application.name=lab13-spring-data-jpa
server.port=8080

# Cấu hình H2 Database theo hướng dẫn Lab 13 (Mục 6)
spring.datasource.url=jdbc:h2:mem:eautdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bật H2 Web Console (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
