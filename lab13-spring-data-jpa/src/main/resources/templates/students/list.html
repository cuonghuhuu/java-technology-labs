<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sinh Viên - Lab 13 Spring Data JPA</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Header Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4">
        <!-- Thông báo Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Thanh tiêu đề & Công cụ -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
                <h2 class="h4 text-primary fw-bold mb-1">
                    <i class="bi bi-people-fill me-2"></i>Danh Sách Sinh Viên
                </h2>
                <p class="text-muted small mb-0">Quản lý thông tin sinh viên lưu trữ trong CSDL (Spring Data JPA)</p>
            </div>
            <div>
                <a th:href="@{/students/create}" class="btn btn-primary shadow-sm">
                    <i class="bi bi-person-plus-fill me-1"></i> Thêm mới sinh viên
                </a>
            </div>
        </div>

        <!-- Card tìm kiếm & Thống kê (Bài 7) -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/students}" method="get" class="row g-3 align-items-center justify-content-between">
                    <div class="col-md-7 col-lg-8">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="keyword" th:value="${keyword}"
                                   class="form-control" placeholder="Tìm kiếm theo họ và tên sinh viên...">
                        </div>
                    </div>
                    <div class="col-md-5 col-lg-4 d-flex gap-2 justify-content-md-end">
                        <button type="submit" class="btn btn-outline-primary px-3">
                            <i class="bi bi-search me-1"></i> Tìm kiếm
                        </button>
                        <a th:if="${keyword != null and !keyword.isEmpty()}" th:href="@{/students}" 
                           class="btn btn-outline-secondary" title="Xóa bộ lọc">
                            <i class="bi bi-arrow-counterclockwise me-1"></i> Đặt lại
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng danh sách sinh viên -->
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <span class="fw-semibold text-secondary">
                    <i class="bi bi-table me-2"></i>Bảng dữ liệu sinh viên
                </span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2">
                    Tổng số: <strong th:text="${students != null ? students.size() : 0}">0</strong> sinh viên
                </span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col" class="text-center" style="width: 70px;">ID</th>
                            <th scope="col" style="width: 150px;">Mã SV</th>
                            <th scope="col">Họ và Tên</th>
                            <th scope="col">Email</th>
                            <th scope="col" style="width: 150px;">Lớp</th>
                            <th scope="col" class="text-center" style="width: 180px;">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${students == null or students.isEmpty()}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                                <span>Không tìm thấy sinh viên nào trong cơ sở dữ liệu!</span>
                            </td>
                        </tr>
                        <tr th:each="s : ${students}">
                            <td class="text-center fw-semibold text-secondary" th:text="${s.id}">1</td>
                            <td>
                                <span class="badge bg-secondary-subtle text-secondary border px-2 py-1 badge-code" th:text="${s.studentCode}">SV001</span>
                            </td>
                            <td>
                                <strong class="text-dark" th:text="${s.fullName}">Nguyễn Văn A</strong>
                            </td>
                            <td>
                                <a th:href="'mailto:' + ${s.email}" class="text-decoration-none text-body" th:text="${s.email}">a@example.com</a>
                            </td>
                            <td>
                                <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-2 py-1" th:text="${s.className}">D18CNPM01</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-outline-warning" title="Chỉnh sửa sinh viên">
                                        <i class="bi bi-pencil-square"></i> Sửa
                                    </a>
                                    <a th:href="@{/students/delete/{id}(id=${s.id})}" class="btn btn-outline-danger"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này khỏi CSDL?');"
                                       title="Xóa sinh viên">
                                        <i class="bi bi-trash"></i> Xóa
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
