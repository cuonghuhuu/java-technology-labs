<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : 'Thông Tin Sinh Viên'} + ' - Lab 13 Spring Data JPA'">Form Sinh Viên</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Header Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Nút quay lại -->
                <div class="mb-3">
                    <a th:href="@{/students}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách sinh viên
                    </a>
                </div>

                <!-- Card chứa Form -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h4 class="card-title mb-0 text-primary fw-bold">
                            <i th:class="${student.id == null ? 'bi bi-person-plus-fill me-2' : 'bi bi-pencil-square me-2'}"></i>
                            <span th:text="${pageTitle != null ? pageTitle : (student.id == null ? 'Thêm Mới Sinh Viên' : 'Chỉnh Sửa Sinh Viên')}"></span>
                        </h4>
                        <p class="text-muted small mb-0 mt-1">Điền đầy đủ các trường thông tin bên dưới để lưu vào cơ sở dữ liệu</p>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/students/save}" th:object="${student}" method="post" novalidate>
                            <!-- Hidden ID để phân biệt Thêm mới hay Cập nhật -->
                            <input type="hidden" th:field="*{id}" />

                            <!-- Mã sinh viên -->
                            <div class="mb-3">
                                <label for="studentCode" class="form-label">
                                    Mã Sinh Viên <span class="required-star">*</span>
                                </label>
                                <input type="text" th:field="*{studentCode}" class="form-control"
                                       th:errorclass="is-invalid"
                                       id="studentCode" placeholder="Ví dụ: 20231768">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}">
                                    Mã sinh viên không hợp lệ
                                </div>
                                <div class="form-text">Mã định danh duy nhất của sinh viên (không trùng lặp).</div>
                            </div>

                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Họ và Tên <span class="required-star">*</span>
                                </label>
                                <input type="text" th:field="*{fullName}" class="form-control"
                                       th:errorclass="is-invalid"
                                       id="fullName" placeholder="Ví dụ: Lê Văn Cường">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                                    Họ và tên không hợp lệ
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Sinh Viên <span class="required-star">*</span>
                                </label>
                                <input type="email" th:field="*{email}" class="form-control"
                                       th:errorclass="is-invalid"
                                       id="email" placeholder="Ví dụ: cuong11220055@gmail.com">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Email không hợp lệ
                                </div>
                            </div>

                            <!-- Lớp học -->
                            <div class="mb-4">
                                <label for="className" class="form-label">
                                    Lớp Học <span class="required-star">*</span>
                                </label>
                                <input type="text" th:field="*{className}" class="form-control"
                                       th:errorclass="is-invalid"
                                       id="className" placeholder="Ví dụ: D18CNPM01">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('className')}" th:errors="*{className}">
                                    Lớp học không hợp lệ
                                </div>
                            </div>

                            <!-- Nút Thao tác -->
                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/students}" class="btn btn-light border px-4">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-floppy-fill me-1"></i> Lưu Sinh Viên
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
