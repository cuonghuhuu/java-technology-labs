<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Kết Quả Đăng Ký Sinh Viên</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #198754; text-align: center; }
        p { font-size: 16px; line-height: 1.6; }
        a { color: #0d6efd; text-decoration: none; font-weight: bold; }
    </style>
</h:head>
<h:body>
    <div class="card">
        <h2>Đăng Ký Sinh Viên Thành Công!</h2>
        <p><strong>Mã SV:</strong> #{studentBean.studentId}</p>
        <p><strong>Họ tên:</strong> #{studentBean.fullName}</p>
        <p><strong>Email:</strong> #{studentBean.email}</p>
        <p><strong>Điểm TB:</strong> #{studentBean.gpa}</p>
        <p><strong>Lớp:</strong> #{studentBean.className}</p>
        <hr />
        <h:outputLink value="index.xhtml">Quay lại trang nhập liệu</h:outputLink>
    </div>
</h:body>
</html>
