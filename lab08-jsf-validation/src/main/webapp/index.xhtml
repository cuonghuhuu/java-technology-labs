<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Lab 8 - JSF Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #0d6efd; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: #dc3545; font-size: 13px; margin-top: 4px; display: block; }
        .btn { background: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn:hover { background: #0b5ed7; }
    </style>
</h:head>
<h:body>
    <div class="card">
        <h2>Quản Lý Sinh Viên - JSF Validation</h2>
        <h:form id="studentForm">
            <div class="form-group">
                <label>Mã Sinh Viên:</label>
                <h:inputText id="studentId" value="#{studentBean.studentId}" />
                <h:message for="studentId" styleClass="error" />
            </div>

            <div class="form-group">
                <label>Họ và Tên:</label>
                <h:inputText id="fullName" value="#{studentBean.fullName}" />
                <h:message for="fullName" styleClass="error" />
            </div>

            <div class="form-group">
                <label>Email:</label>
                <h:inputText id="email" value="#{studentBean.email}" />
                <h:message for="email" styleClass="error" />
            </div>

            <div class="form-group">
                <label>Điểm Trung Bình (0 - 10):</label>
                <h:inputText id="gpa" value="#{studentBean.gpa}" />
                <h:message for="gpa" styleClass="error" />
            </div>

            <div class="form-group">
                <label>Lớp Học:</label>
                <h:inputText id="className" value="#{studentBean.className}" />
                <h:message for="className" styleClass="error" />
            </div>

            <h:commandButton value="Lưu Thông Tin" action="#{studentBean.submit}" styleClass="btn" />
        </h:form>
    </div>
</h:body>
</html>
