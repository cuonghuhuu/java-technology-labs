<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sinh Viên - Lab 12 Spring MVC</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Header Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">

                <!-- Breadcrumb điều hướng -->
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/students}" class="text-decoration-none">Sinh viên</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Chi tiết</li>
                    </ol>
                </nav>

                <!-- Thẻ hiển thị chi tiết (Bài 6) -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold text-primary">
                            <i class="bi bi-person-badge-fill me-2"></i> Thông Tin Chi Tiết Sinh Viên
                        </h5>
                        <span class="badge bg-primary fs-6 px-3 py-2" th:text="${student.studentCode}">SV0001</span>
                    </div>
                    <div class="card-body p-4">

                        <div class="row g-3">
                            <div class="col-sm-4 text-muted fw-semibold">ID Hệ Thống:</div>
                            <div class="col-sm-8 fw-bold" th:text="${student.id}">1</div>

                            <div class="col-sm-4 text-muted fw-semibold">Mã sinh viên:</div>
                            <div class="col-sm-8">
                                <span class="badge bg-light text-primary border border-primary fs-6 px-3 py-1 font-monospace" 
                                      th:text="${student.studentCode}">SV0001</span>
                            </div>

                            <div class="col-sm-4 text-muted fw-semibold">Họ và tên:</div>
                            <div class="col-sm-8 fs-5 fw-bold text-dark" th:text="${student.fullName}">Nguyễn Văn An</div>

                            <div class="col-sm-4 text-muted fw-semibold">Địa chỉ Email:</div>
                            <div class="col-sm-8">
                                <a th:href="'mailto:' + ${student.email}" class="text-decoration-none" th:text="${student.email}">
                                    an.nv@eaut.edu.vn
                                </a>
                            </div>

                            <div class="col-sm-4 text-muted fw-semibold">Lớp học:</div>
                            <div class="col-sm-8">
                                <span class="badge bg-secondary-subtle text-secondary border px-3 py-2" th:text="${student.className}">
                                    D15CNPM01
                                </span>
                            </div>
                        </div>

                        <!-- Các nút điều hướng & thao tác -->
                        <div class="d-flex justify-content-between align-items-center pt-4 mt-4 border-top">
                            <a th:href="@{/students}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Danh sách sinh viên
                            </a>
                            <div class="d-flex gap-2">
                                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning">
                                    <i class="bi bi-pencil-square me-1"></i> Chỉnh sửa
                                </a>
                                <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                                   class="btn btn-danger"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này không?');">
                                    <i class="bi bi-trash me-1"></i> Xóa
                                </a>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
