<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id != null ? 'Cập Nhật Sinh Viên' : 'Thêm Mới Sinh Viên'} + ' - Lab 12 Spring MVC'">Thêm Mới Sinh Viên</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Header Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">

                <!-- Breadcrumb điều hướng -->
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/students}" class="text-decoration-none">Sinh viên</a></li>
                        <li class="breadcrumb-item active" aria-current="page" 
                            th:text="${student.id != null ? 'Chỉnh sửa sinh viên' : 'Thêm mới sinh viên'}">
                            Thêm mới
                        </li>
                    </ol>
                </nav>

                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold text-primary">
                            <i th:class="${student.id != null ? 'bi bi-pencil-square me-2' : 'bi bi-person-plus-fill me-2'}"></i>
                            <span th:text="${student.id != null ? 'Cập Nhật Thông Tin Sinh Viên' : 'Thêm Mới Sinh Viên'}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-4">

                        <!-- Form nhập liệu sinh viên (Bài 4, 5, 7, 10) -->
                        <form th:action="@{/students/save}" th:object="${student}" method="post" novalidate>
                            <!-- Thông báo tổng quát nếu có lỗi validation -->
                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger mb-4 shadow-sm" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <strong>Vui lòng kiểm tra lại thông tin nhập liệu:</strong>
                                <ul class="mb-0 mt-2 small">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                </ul>
                            </div>

                            <!-- Hidden ID phục vụ cho chức năng Sửa (Bài 7) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Mã sinh viên -->
                            <div class="mb-3">
                                <label for="studentCode" class="form-label">
                                    Mã sinh viên <span class="required-star">*</span>
                                </label>
                                <input type="text" id="studentCode" th:field="*{studentCode}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('studentCode')} ? 'is-invalid' : ''"
                                       placeholder="Ví dụ: SV0005 (tối thiểu 5 ký tự)">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}">
                                    Mã sinh viên không hợp lệ
                                </div>
                                <div class="form-text">Mã định danh duy nhất của sinh viên, tối thiểu 5 ký tự.</div>
                            </div>

                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Họ và tên <span class="required-star">*</span>
                                </label>
                                <input type="text" id="fullName" th:field="*{fullName}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                       placeholder="Ví dụ: Nguyễn Văn Nam">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                                    Họ tên không được để trống
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Địa chỉ Email <span class="required-star">*</span>
                                </label>
                                <input type="email" id="email" th:field="*{email}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                       placeholder="Ví dụ: nam.nv@eaut.edu.vn">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Email không đúng định dạng
                                </div>
                            </div>

                            <!-- Lớp học -->
                            <div class="mb-4">
                                <label for="className" class="form-label">
                                    Lớp học <span class="required-star">*</span>
                                </label>
                                <input type="text" id="className" th:field="*{className}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('className')} ? 'is-invalid' : ''"
                                       placeholder="Ví dụ: D15CNPM01">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('className')}" th:errors="*{className}">
                                    Lớp học không được để trống
                                </div>
                            </div>

                            <!-- Nút Thao tác -->
                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/students}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-floppy-fill me-1"></i>
                                    <span th:text="${student.id != null ? 'Cập nhật' : 'Lưu sinh viên'}">Lưu</span>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
